[project]
name = "trainloop"
version = "0.1.0"
description = "Headless pipeline: documents + goal -> training JSONL -> fine-tune -> model handback"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.129",
    "httpx>=0.28",
    "huggingface_hub>=1.32",
    "python-dotenv>=1.0",
    "typer>=0.19",
]

[project.scripts]
trainloop = "trainloop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
